[build]
  base = "site"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# live.json points the page at the live demo backend; never cache it.
[[headers]]
  for = "/live.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Disposition = "attachment"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
